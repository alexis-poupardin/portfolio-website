<!-- ================= SECTION 2: carousel + footer (full screen) ================= -->
  <section class="lower-section" id="lower-section">
 
    <div id="carousel-index" class="homepage-carousel carousel-index"
         role="region" aria-roledescription="carousel" aria-label="Featured work">
      <div class="carousel-viewport">
        <div class="carousel-track">

          <!-- One <article> per map. index.js cuts each <img> into the 3 folding panels by itself,
               so adding a map = copying one <article> (and one dot below). -->
          <article class="carousel-slide is-active" aria-roledescription="slide" aria-label="1 of 3">
            <div class="carousel-image-frame">
              <img class="map-source" src="./IMAGES/NASA_BlackMarble_2016_Europe.png" alt="Satellite view of Europe at night" decoding="async">
            </div>
          </article>

          <article class="carousel-slide" aria-roledescription="slide" aria-label="2 of 3" aria-hidden="true">
            <div class="carousel-image-frame">
              <img class="map-source" src="./MAPS/Paris_literature.webp" alt="Paris litterature map" decoding="async">
            </div>
          </article>

          <article class="carousel-slide" aria-roledescription="slide" aria-label="3 of 3" aria-hidden="true">
            <div class="carousel-image-frame">
              <img class="map-source" src="./MAPS/Honduras.webp" alt="Honduras topographic map" decoding="async">
            </div>
          </article>

        </div>
      </div>
      <button class="carousel-control carousel-control--previous" type="button" aria-label="Show previous image"><span aria-hidden="true">&#10094;</span></button>
      <button class="carousel-control carousel-control--next" type="button" aria-label="Show next image"><span aria-hidden="true">&#10095;</span></button>
      <div class="carousel-dots" aria-label="Choose an image">
        <button class="carousel-dot is-active" type="button" aria-label="Show image 1" aria-current="true"></button>
        <button class="carousel-dot" type="button" aria-label="Show image 2"></button>
        <button class="carousel-dot" type="button" aria-label="Show image 3"></button>
      </div>
    </div>
 
    <!-- JS footer fetch-->

    <!-- The footer is injected INSIDE the lower section, so it sits at the bottom of that screen.
         (common.css already gives #footer-placeholder display: contents.) -->
    <div id="footer-placeholder"></div>
 
  </section>
